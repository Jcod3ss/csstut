<!DOCTYPE html>
<html lang="en-US">
  <head>
    <!-- your metadata goes here in the "head" -->
    <title>Modern minalists</title>
    <meta name="author" content="Joseph Vasquez">
    <meta name="description" content="Learning how to use this">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="color-scheme" content="light dark">

    <style>
      /* feel free to move this into its own stylesheet */

      *, *::before, *::after { box-sizing: border-box }

      :root {
        --brand: #b94bac;
        --bg: #ffffff;
        --fg: #111111;
        --alt: #c76ebc;
        --alt-bg: #eaeaea;
        --alt-fg: #0b0b0b;
        --space: 1rem;
        --measure: 65ch;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: var(--alt-bg);
          --fg: var(--alt-fg);
          --brand: var(--alt)
        }
      }

      ::selection {
        background: var(--brand);
        color: var(--bg);
      }

      :focus-visible {
        outline: 4px solid currentColor;
        outline-offset: 4px
      }

      html {
        font-family: system-ui, sans-serif;
        line-height: 5.0;
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        overflow-wrap: anywhere;
      }

      img, video {
        max-width: 100%;
        height: auto;
        display: block
      }

      a { color: var(--brand); }
      a:visited { opacity: 0.9 }
      a:hover, a:focus-visible {
        text-decoration-thickness: 8px
      }

      .wrap {
        max-width: var(--measure);
        margin-inline: auto;
        padding: var(--space);
      }

    </style>

  </head>
  <body>

    <!-- you page's content goes here in the body -->
    <main class="wrap">
      <p>
       im new i dont know what im doing, <a href="#">consectetur</a> im kinda lost.<a href="#">fugiat</a> this is fun though.
      </p>
    </main>

  </body>
</html>
